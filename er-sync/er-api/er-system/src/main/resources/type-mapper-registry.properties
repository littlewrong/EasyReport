# Database Component Registry Configuration
# Format: db.<DATABASE_TYPE>=<TypeMapperClass>,<ExtractorClass>,<DialectClass>
#
# 说明：
# - DATABASE_TYPE: 数据库类型标识（大写），如 MYSQL, TIDB, STARROCKS 等
# - TypeMapperClass: 实现 DatabaseTypeMapper 接口的类全限定名
# - ExtractorClass: 实现 SchemaExtractor 接口的类全限定名
# - DialectClass: 实现 SchemaDialect 接口的类全限定名
#
# 新增数据库支持时，只需在此文件添加一行配置即可

# MySQL 数据库
db.MYSQL=cn.easyreport.system.sync.mapper.MySqlTypeMapper,\
  cn.easyreport.system.sync.extractor.MySqlSchemaExtractor,\
  cn.easyreport.system.sync.dialect.MySqlDialect

# TiDB 数据库
db.TIDB=cn.easyreport.system.sync.mapper.TiDbTypeMapper,\
  cn.easyreport.system.sync.extractor.TiDbSchemaExtractor,\
  cn.easyreport.system.sync.dialect.TiDbDialect

# StarRocks 数据库
db.STARROCKS=cn.easyreport.system.sync.mapper.StarRocksTypeMapper,\
  cn.easyreport.system.sync.extractor.StarRocksSchemaExtractor,\
  cn.easyreport.system.sync.dialect.StarRocksDialect

# SQL Server 数据库
db.SQLSERVER=cn.easyreport.system.sync.mapper.SqlServerTypeMapper,\
  cn.easyreport.system.sync.extractor.SqlServerSchemaExtractor,\
  cn.easyreport.system.sync.dialect.SqlServerDialect

# PostgreSQL 数据库
db.POSTGRESQL=cn.easyreport.system.sync.mapper.PostgreSqlTypeMapper,\
  cn.easyreport.system.sync.extractor.PostgreSqlSchemaExtractor,\
  cn.easyreport.system.sync.dialect.PostgreSqlDialect

# Oracle 数据库
db.ORACLE=cn.easyreport.system.sync.mapper.OracleTypeMapper,\
  cn.easyreport.system.sync.extractor.OracleSchemaExtractor,\
  cn.easyreport.system.sync.dialect.OracleDialect
